# Nginx site config for fair.tergym.com
#
# Install with:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/fair
#   sudo ln -sf /etc/nginx/sites-available/fair /etc/nginx/sites-enabled/fair
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Then run certbot to enable HTTPS:
#   sudo certbot --nginx -d fair.tergym.com

server {
    listen 80;
    listen [::]:80;
    server_name fair.tergym.com;

    # Static files collected by `manage.py collectstatic`
    location /static/ {
        alias /home/mark/Downloads/markdesktop/PROJECTS/REMINDER/forex_reminder/staticfiles/;
        expires 30d;
        access_log off;
    }

    # User-uploaded media
    location /media/ {
        alias /home/mark/Downloads/markdesktop/PROJECTS/REMINDER/forex_reminder/media/;
        expires 7d;
        access_log off;
    }

    # Everything else goes to Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
